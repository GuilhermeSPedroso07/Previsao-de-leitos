[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "previsao-leitos-rs"
version = "0.5.0"
description = "Previsão de enchentes por bacias hidrográficas e demanda real de leitos SUS (SIH/CNES) no RS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "matplotlib>=3.8",
    "google-cloud-bigquery>=3.17",
    "db-dtypes>=1.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["src*"]
